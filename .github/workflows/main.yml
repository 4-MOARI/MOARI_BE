name: BE CI

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # 코드 스타일·실수 검사. 에러가 있으면 여기서 실패하고 다음 단계로 가지 않는다.
      - name: Lint
        run: npm run lint

      # Jest 테스트 + 커버리지 측정
      - name: Test
        run: npm run test:coverage
